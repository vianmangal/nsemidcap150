name: NSE Screener Daily

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOG_LEVEL: INFO
      DATA_DIR: data
      RUN_INGESTION: "1"
      RUN_RANKING: "1"
      RUN_INDICATORS: "1"
      RUN_CAR: "1"
      RUN_FINAL: "1"
      RUN_SHEETS: "1"
      RANK_MODE: turnover
      TOP_N: "250"
      FINAL_TAG: daily
      YFINANCE_START: "2024-01-01"
      GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      YFINANCE_SYMBOLS: ${{ secrets.YFINANCE_SYMBOLS }}
      YFINANCE_END: ${{ secrets.YFINANCE_END }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare logs
        run: mkdir -p logs

      - name: Run screener with retries
        run: |
          set -euo pipefail
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts"
            if python main.py 2>&1 | tee -a logs/run.log; then
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep $((attempt * 30))
          done
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-logs
          path: logs/**

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-outputs
          path: output/**
